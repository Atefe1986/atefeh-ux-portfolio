<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Atefeh Etemadipour — UX/UI Designer</title>
    <!--
      SPA fallback for GitHub Pages. Encodes the requested deep-link path into a
      query string and redirects to the app's base, where index.html restores it.
      pathSegmentsToKeep = 1 keeps the project base "/atefeh-ux-portfolio/".
    -->
    <script type="text/javascript">
      var pathSegmentsToKeep = 1
      var l = window.location
      l.replace(
        l.protocol +
          '//' +
          l.hostname +
          (l.port ? ':' + l.port : '') +
          l.pathname
            .split('/')
            .slice(0, 1 + pathSegmentsToKeep)
            .join('/') +
          '/?/' +
          l.pathname
            .slice(1)
            .split('/')
            .slice(pathSegmentsToKeep)
            .join('/')
            .replace(/&/g, '~and~') +
          (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
          l.hash
      )
    </script>
  </head>
  <body></body>
</html>
